[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Scheduled functions are not exposed as public production HTTP endpoints.
[functions."booking-emails"]
  schedule = "*/15 * * * *"

# Serve existing assets normally, and let the app handle other paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
